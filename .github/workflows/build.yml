name: Build Underworld Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'
          cache-provider: basic

      - name: Build Fabric mod
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace build 2>&1 | tee build-log.txt

      - name: Upload compiled JARs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: underworld-fabric-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: underworld-build-log
          path: build-log.txt
          if-no-files-found: warn
